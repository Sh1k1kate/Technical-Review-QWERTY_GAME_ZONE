<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Мониторинг игр — QWERTY Game Zone</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="free-icon-computer-hardware-9379073.png">
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
        body { background: #f4f7fb; color: #1e293b; padding: 10px; min-height: 100vh; }
        body.dark-theme { background: #0f172a; color: #e2e8f0; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        h1 { font-size: 1.4rem; font-weight: 600; }
        .theme-toggle { background: white; border: 1px solid #e2e8f0; border-radius: 40px; padding: 8px 14px; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .nav-links { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .nav-link { background: white; border: 1px solid #e2e8f0; border-radius: 40px; padding: 12px 20px; text-decoration: none; color: #1e293b; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
        .nav-link.primary { background: #3b82f6; color: white; border: none; }
        .map-controls { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .map-search { flex: 1; min-width: 160px; position: relative; }
        .map-search input { width: 100%; padding: 12px 12px 12px 38px; border: 1px solid #e2e8f0; border-radius: 40px; font-size: 0.95rem; background: white; }
        .map-search:before { content: "🔍"; position: absolute; left: 14px; top: 12px; color: #94a3b8; font-size: 1rem; }
        .filter-chip { background: white; border: 1px solid #e2e8f0; border-radius: 40px; padding: 8px 14px; font-size: 0.9rem; cursor: pointer; }
        .filter-chip.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .computers-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin-bottom: 20px; max-height: 450px; overflow-y: auto; background: white; border-radius: 32px; padding: 16px; }
        .dark-theme .computers-map { background: #1e293b; }
        .map-item { background: white; border: 2px solid #e2e8f0; border-radius: 18px; padding: 8px 4px; text-align: center; cursor: pointer; aspect-ratio: 1/1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .map-item.good { border-color: #22c55e; background: #f0fdf4; }
        .map-item.bad { border-color: #ef4444; background: #fef2f2; }
        .dark-theme .map-item.good { background: #14532d; border-color: #22c55e; }
        .dark-theme .map-item.bad { background: #7f1d1d; border-color: #ef4444; }
        .map-item.update { border-color: #eab308; background: #fefce8; }
        .dark-theme .map-item.update { background: #854d0e; border-color: #eab308; }
        .map-number { font-weight: 800; font-size: 1.3rem; margin-bottom: 4px; }
        .map-status-icon { font-size: 1.2rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; padding: 16px; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 32px; padding: 24px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; }
        .dark-theme .modal-content { background: #1e293b; color: #f1f5f9; }
        .modal-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 10px; }
        .game-list { list-style: none; }
        .game-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #e2e8f0; }
        .dark-theme .game-item { border-bottom-color: #334155; }
        .game-status { font-size: 1.2rem; width: 24px; text-align: center; }
        .game-name { flex: 1; }
        .close-btn { background: #3b82f6; color: white; border: none; border-radius: 40px; padding: 12px; width: 100%; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .loading { text-align: center; padding: 20px; }
        .last-update { font-size: 0.8rem; color: #64748b; text-align: right; margin-top: 10px; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: white; padding: 12px 20px; border-radius: 60px; font-weight: 500; animation: fade 3s; z-index: 1000; }
        .toast.error { background: #ef4444; }
        @keyframes fade { 0% { opacity: 0; transform: translateX(-50%) translateY(20px); } 10% { opacity: 1; transform: translateX(-50%) translateY(0); } 90% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-links">
        <a href="index.html" class="nav-link">🖥️ Технический отчёт</a>
        <a href="games.html" class="nav-link primary">👾 Статус Игр</a>
        <a href="inventory.html?secret=INVENTORY2026" class="nav-link">📦 Инвентаризация</a>
    </div>

    <div class="header">
        <h1>🎮 Статус игр и обновлений</h1>
        <div class="theme-toggle" id="themeToggle">
            <span>🌙</span> Тёмная
        </div>
    </div>

    <div class="map-controls">
        <div class="map-search">
            <input type="text" id="mapSearch" placeholder="Поиск по номеру ПК...">
        </div>
        <div class="filter-chip active" data-filter="all">Все</div>
        <div class="filter-chip" data-filter="good">✅ Игры на месте</div>
        <div class="filter-chip" data-filter="bad">❌ Есть удалённые</div>
        <div class="filter-chip" data-filter="update">🔄 Есть обновления</div>
    </div>

    <div id="loadingIndicator" class="loading">Загрузка данных с GitHub...</div>

    <div class="computers-map" id="computersMap" style="display: none;"></div>
    <div id="lastUpdateTime" class="last-update"></div>
</div>

<!-- Модальное окно с деталями игр -->
<div class="modal" id="detailsModal">
    <div class="modal-content">
        <div class="modal-title" id="modalPcTitle">Компьютер №<span id="modalPcNumber"></span></div>
        <div id="modalLastCheck"></div>
        <ul class="game-list" id="gameList"></ul>
        <div id="modalTotalInfo" style="margin: 10px 0;"></div>
        <button class="close-btn" id="closeModalBtn">Закрыть</button>
    </div>
</div>

<div id="toastMessage" style="display: none;" class="toast"></div>

<script>
    (function() {
        // ========== КОНФИГУРАЦИЯ ==========
        const GITHUB_OWNER = 'Sh1k1kate';
        const GITHUB_REPO = 'Technical-Review-QWERTY_GAME_ZONE';
        const STATUS_FILE = 'games_status.json';
        
        // Состояние
        let gamesStatus = {};
        let allGameNames = []; // будет заполнен автоматически
        let isDarkTheme = localStorage.getItem('dark_theme') === 'true';
        let activeFilter = 'all';
        let searchQuery = '';

        // DOM
        const mapEl = document.getElementById('computersMap');
        const loadingEl = document.getElementById('loadingIndicator');
        const lastUpdateEl = document.getElementById('lastUpdateTime');
        const modal = document.getElementById('detailsModal');
        const modalPcNumber = document.getElementById('modalPcNumber');
        const modalLastCheck = document.getElementById('modalLastCheck');
        const gameListEl = document.getElementById('gameList');
        const modalTotalInfo = document.getElementById('modalTotalInfo');
        const themeToggle = document.getElementById('themeToggle');
        const toastEl = document.getElementById('toastMessage');

        // Тема
        if (isDarkTheme) {
            document.body.classList.add('dark-theme');
            themeToggle.innerHTML = '☀️ Светлая';
        }
        themeToggle.addEventListener('click', () => {
            isDarkTheme = !isDarkTheme;
            document.body.classList.toggle('dark-theme');
            themeToggle.innerHTML = isDarkTheme ? '☀️ Светлая' : '🌙 Тёмная';
            localStorage.setItem('dark_theme', isDarkTheme);
        });

        function showToast(text, type = 'success') {
            toastEl.className = 'toast' + (type === 'error' ? ' error' : '');
            toastEl.style.display = 'block';
            toastEl.innerText = text;
            setTimeout(() => toastEl.style.display = 'none', 3000);
        }

        // Загрузка данных с GitHub
        async function loadStatus() {
            try {
                loadingEl.style.display = 'block';
                mapEl.style.display = 'none';
                
                const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${STATUS_FILE}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                gamesStatus = await response.json();
                
                // Собираем все уникальные названия игр из всех ПК
                const namesSet = new Set();
                for (const pcData of Object.values(gamesStatus)) {
                    if (pcData.games) {
                        Object.keys(pcData.games).forEach(name => namesSet.add(name));
                    }
                    // также можно учесть missing, но games более точно
                }
                allGameNames = Array.from(namesSet).sort();
                
                renderMap();
                loadingEl.style.display = 'none';
                mapEl.style.display = 'grid';
                
                const times = Object.values(gamesStatus).map(s => s.last_check).filter(t => t);
                if (times.length > 0) {
                    const latest = times.sort().reverse()[0];
                    lastUpdateEl.textContent = `Последнее обновление: ${new Date(latest).toLocaleString('ru')}`;
                }
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                loadingEl.innerHTML = '❌ Не удалось загрузить данные.';
                showToast('Ошибка загрузки данных', 'error');
            }
        }

        // Определение статуса ПК с учётом обновлений
        function getPcStatus(pcData) {
            if (!pcData) return 'unknown';
            const missing = pcData.missing && pcData.missing.length > 0;
            const hasUpdate = pcData.games && Object.values(pcData.games).some(g => g.update_available);
            if (missing) return 'bad';
            if (hasUpdate) return 'update';
            return 'good';
        }

        function renderMap() {
            mapEl.innerHTML = '';
            const pcKeys = Object.keys(gamesStatus).sort((a,b) => parseInt(a)-parseInt(b));
            for (const pcKey of pcKeys) {
                const pcData = gamesStatus[pcKey];
                if (!pcData) continue;
                const status = getPcStatus(pcData);
                
                if (activeFilter !== 'all' && status !== activeFilter) continue;
                if (searchQuery && !pcKey.includes(searchQuery)) continue;
                
                const item = document.createElement('div');
                item.className = `map-item ${status}`;
                item.setAttribute('data-pc', pcKey);
                
                let icon = '❓';
                if (status === 'good') icon = '✅';
                else if (status === 'bad') icon = '❌';
                else if (status === 'update') icon = '🔄';
                
                item.innerHTML = `
                    <div class="map-number">${pcKey}</div>
                    <div class="map-status-icon">${icon}</div>
                `;
                item.addEventListener('click', () => showDetails(pcKey));
                mapEl.appendChild(item);
            }
        }

        function showDetails(pcNum) {
            const pcData = gamesStatus[pcNum];
            if (!pcData) {
                showToast(`Нет данных о ПК ${pcNum}`, 'error');
                return;
            }
            modalPcNumber.textContent = pcNum;
            gameListEl.innerHTML = '';

            const gamesInfo = pcData.games || {};
            const missingSet = new Set(pcData.missing || []);
            let missingCount = 0;
            let updateCount = 0;

            // Перебираем все игры, которые известны системе
            for (const name of allGameNames) {
                const info = gamesInfo[name] || null;
                // Если игра есть в gamesInfo и installed == true, то смотрим update_available
                // иначе если она в missing – отсутствует, иначе считаем отсутствующей (на всякий случай)
                let icon = '❓';
                if (info && info.installed) {
                    if (info.update_available) {
                        icon = '🔄';
                        updateCount++;
                    } else {
                        icon = '✅';
                    }
                } else if (missingSet.has(name)) {
                    icon = '❌';
                    missingCount++;
                } else {
                    // Если нет ни в installed, ни в missing, считаем отсутствующей
                    icon = '❌';
                    missingCount++;
                }

                const li = document.createElement('li');
                li.className = 'game-item';
                li.innerHTML = `<span class="game-status">${icon}</span><span class="game-name">${name}</span>`;
                gameListEl.appendChild(li);
            }

            modalTotalInfo.textContent = `Отсутствует: ${missingCount} | Обновлений: ${updateCount}`;
            if (pcData.last_check) {
                modalLastCheck.textContent = `Проверено: ${new Date(pcData.last_check).toLocaleString('ru')}`;
            } else {
                modalLastCheck.textContent = '';
            }
            modal.classList.add('active');
        }

        // Фильтры
        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                activeFilter = this.dataset.filter;
                renderMap();
            });
        });

        document.getElementById('mapSearch').addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            renderMap();
        });

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            modal.classList.remove('active');
        });
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        setInterval(loadStatus, 300000);
        loadStatus();
    })();
</script>
</body>
</html>
